# 12 §6 flow 8 — Arabic (RTL): the Try story in Arabic up to Home; screenshots for native-speaker review.
appId: org.tara.app
---
- launchApp:
    clearState: true
- tapOn: { id: "lang-ar_EG" }
- tapOn: { id: "language-continue" }
- takeScreenshot: ar-welcome
- tapOn: { id: "welcome-try" }
- tapOn: { id: "connect-button" }
- tapOn: { id: "connect-allow", optional: true }
- extendedWaitUntil: { visible: { id: "connect-demo" }, timeout: 20000 }
- tapOn: { id: "connect-demo" }
- extendedWaitUntil: { visible: { id: "connect-next", enabled: true }, timeout: 15000 }
- tapOn: { id: "connect-next" }
- tapOn: { id: "calibrate-skip" }
- extendedWaitUntil: { visible: { id: "prompt" }, timeout: 30000 }
- takeScreenshot: ar-prompt
- tapOn: { id: "prompt-yes" }
- takeScreenshot: ar-cooling
