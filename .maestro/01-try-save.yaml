# 12 §6 flow 1 — first run → Save (03 Flows O1–O6, rebuilt 2026-11-17): Language → Meet TARA (3 pages) → Connect
# (demo) → skip calibration → Keep TARA? Yes → name skip → age 26–35 → PMDD-aware cooling (day 1 = 3 days ago,
# 28 days) → reminders Yes → family skip → Daily Home with the one-time tip and the cycle card.
appId: org.tara.app
---
- launchApp:
    clearState: true
- tapOn: { id: "lang-en" }
- tapOn: { id: "language-continue" }
- assertVisible: "Your tarha keeps you cool"
- tapOn: { id: "intro-next" }
- tapOn: { id: "intro-next" }
- tapOn: { id: "intro-start" }
- tapOn: { id: "connect-button" }
- tapOn: { id: "connect-allow", optional: true }
- extendedWaitUntil: { visible: { id: "connect-demo" }, timeout: 20000 }
- tapOn: { id: "connect-demo" }
- assertVisible: "DEMO — not real brain data"
- extendedWaitUntil: { visible: { id: "connect-next", enabled: true }, timeout: 15000 }
- tapOn: { id: "connect-next" }
- tapOn: { id: "calibrate-skip" }
- assertVisible: "Keep TARA on this phone?"
- tapOn: { id: "save-yes" }
- tapOn: { id: "setup-name-skip" }
- tapOn: { id: "setup-age-26_35" }
- assertVisible: "Do you want PMDD-aware cooling?"
- tapOn: { id: "setup-cycle-yes" }
- tapOn: { id: "setup-cycle-day-3" }
- tapOn: { id: "setup-cycle-length-next" }
- tapOn: { id: "setup-reminders-yes" }
- tapOn: { id: "setup-finish" }
- assertVisible: { id: "tab-bar" }
- assertVisible: { id: "first-tip" }
- assertVisible: "Menstrual phase"
- tapOn: { id: "first-tip-ok" }
