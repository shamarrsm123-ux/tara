# 12 §6 flow 2 — first run → Not now: "Okay. Nothing was saved." → TARA keeps running unsaved with the
# "Keep TARA on this phone" card; a relaunch starts fresh on Language (nothing was stored).
appId: org.tara.app
---
- launchApp:
    clearState: true
- tapOn: { id: "lang-en" }
- tapOn: { id: "language-continue" }
- tapOn: { id: "intro-next" }
- tapOn: { id: "intro-next" }
- tapOn: { id: "intro-start" }
- tapOn: { id: "connect-button" }
- tapOn: { id: "connect-allow", optional: true }
- extendedWaitUntil: { visible: { id: "connect-demo" }, timeout: 20000 }
- tapOn: { id: "connect-demo" }
- extendedWaitUntil: { visible: { id: "connect-next", enabled: true }, timeout: 15000 }
- tapOn: { id: "connect-next" }
- tapOn: { id: "calibrate-skip" }
- tapOn: { id: "save-no" }
- assertVisible: "Okay. Nothing was saved."
- tapOn: { id: "notice-ok" }
- assertVisible: { id: "try-keep" }
- stopApp
- launchApp
- assertVisible: { id: "screen-language" }
